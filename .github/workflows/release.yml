name: Release FileWheel (Universal macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Universal FileWheel.app & package ZIP + DMG
        run: |
          chmod +x build_app.sh
          ./build_app.sh --skip-install --package
          file FileWheel.app/Contents/MacOS/FileWheel
          ls -lh FileWheel-macOS-Universal.zip FileWheel-macOS-Universal.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v1.0.0"
          fi
          gh release create "${TAG}" \
            FileWheel-macOS-Universal.dmg \
            FileWheel-macOS-Universal.zip \
            --title "FileWheel ${TAG}" \
            --notes "Universal macOS release (Apple Silicon + Intel, macOS 14.0+). No Xcode required — drag **FileWheel.app** into **Applications** and open it once (if macOS Gatekeeper prompts, go to System Settings → Privacy & Security → Open Anyway, or run \`xattr -cr /Applications/FileWheel.app && open /Applications/FileWheel.app\`)." \
            || gh release upload "${TAG}" FileWheel-macOS-Universal.dmg FileWheel-macOS-Universal.zip --clobber
